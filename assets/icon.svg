<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SyntaxLab">
  <!--
    The canonical SyntaxLab mark — 09_DESIGN_SYSTEM.md §16, 07_PWA_OFFLINE.md §6

    THE source of truth. Every icon the product ships is rendered from this one
    file by scripts/make-icons.mjs: the browser favicon, the .ico fallback, the
    Apple touch icon and the PWA manifest icons. There is deliberately no
    second drawing anywhere.

    The mark is `/^/` — the regex literal delimiters that frame the pattern
    input in the application itself, with a caret between them. It says what
    the product is without spelling out a word that would be illegible at
    48 px.

    ---

    RESTORED, NOT REDRAWN. A previous change replaced this with an angular "S"
    and it was rejected. The geometry below is recovered verbatim from git —
    `git show 9364002^:assets/icon.svg` — down to the path data, stroke widths
    and cap style. Nothing was reinterpreted from memory.

    **Only the palette moved.** The original was authored against the M8 theme
    tokens, which the M10 correction pass retired. The obsolete values and
    their replacements, keeping the original relationship intact — delimiters
    bright, caret deeper:

        background   #0a0e0c  ->  #0D0208
        delimiters   #00ff88  ->  #00FF41
        caret        #1fbf6b  ->  #008F11

    Those are the specified Matrix palette (09_DESIGN_SYSTEM.md §12.1) rather
    than theme tokens: a manifest is a static build artefact and a splash
    screen cannot follow a runtime theme, so the icon stays Matrix green even
    for a user running Crimson Night.

    Small sizes are handled by optical scaling in the generator — thicker
    strokes and a tighter viewBox, the same three elements. See
    `scripts/make-icons.mjs`.
  -->
  <rect width="512" height="512" fill="#0D0208" />

  <!-- Slashes: the regex delimiters. -->
  <g stroke="#00FF41" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M150 138 L106 374" />
    <path d="M406 138 L362 374" />
  </g>

  <!-- The caret, in the deeper Matrix green, so the mark carries two steps of
       the palette rather than a single flat colour. -->
  <path
    d="M196 300 L256 212 L316 300"
    stroke="#008F11"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
