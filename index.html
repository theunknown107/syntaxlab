<!doctype html>
<html lang="en" data-contrast="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title matches the shipped scope. It broadens to include Cron at V1.1
         and not before: promising a feature in metadata that does not exist is
         the same defect as a disabled tab in the UI (21_ACCEPTANCE_CRITERIA D-11). -->
    <title>SyntaxLab — Regex &amp; JSON Explainer</title>
    <meta
      name="description"
      content="Understand regular expressions and JSON. Plain-English explanations, live testing, and a syntax tree. Runs in your browser — the app doesn't upload what you paste."
    />

    <meta name="theme-color" content="#0a0e0c" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SyntaxLab — Regex &amp; JSON Explainer" />
    <meta
      property="og:description"
      content="Understand regular expressions and JSON. Runs in your browser."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Development-time CSP. Production policy is served as real headers from
         public/_headers (17_DEPLOYMENT.md §4) because frame-ancestors and
         report-to are ignored in a meta tag.

         This tag is deliberately NOT weaker than production for script-src.
         The one difference is style-src, which production also carries: it is
         required by runtime style injection and is documented as residual risk
         RR-02, not a development shortcut (05_SECURITY.md §4.3). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />

    <meta name="referrer" content="no-referrer" />

    <!-- Theme bootstrap. A separate same-origin file, never inline: script-src
         is 'self' and we do not weaken it for a cosmetic fix. Blocking on
         purpose — a flash of the wrong theme on every load is worse than
         under 1 KB of blocking script (06_DATA_STORAGE.md §5.1). -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #e8f0eb; background: #0a0e0c">
        SyntaxLab needs JavaScript. All analysis runs locally in your browser, which is why there is
        no server-rendered fallback — there is no server.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
